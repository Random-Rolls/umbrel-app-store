version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-materialious_web_1
      APP_PORT: 3000

  web:
    image: wardpearce/materialious-full:1.18.35
    restart: on-failure
    stop_grace_period: 1m
    environment:
      - COOKIE_SECRET=${APP_SEED}
      - DATABASE_CONNECTION_URI=sqlite:///materialious-data/materialious.db
      - PUBLIC_CAPTCHA_DISABLED=true
      - PUBLIC_REGISTRATION_ALLOWED=true
      - ORIGIN=http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      - PUBLIC_DEFAULT_INVIDIOUS_INSTANCE=http://${DEVICE_DOMAIN_NAME}:3420
    volumes:
      - ${APP_DATA_DIR}/data:/materialious-data
