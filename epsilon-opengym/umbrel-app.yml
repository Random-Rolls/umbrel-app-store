manifestVersion: 1
id: epsilon-opengym
category: files
name: openGym
version: "1.4.6"
tagline: Self-hosted workout and body-weight tracker
icon: https://raw.githubusercontent.com/DuarteSantos8/openGym/main/frontend/public/icon-512.png
description: >-
  openGym is a self-hosted gym and body-weight tracker you run yourself. Plan a
  weekly routine, run guided workouts, log every set and track body weight over time.


  It syncs across the devices you sign into, installs as a home-screen app, and
  supports passkey sign-in as well as a password login. Guest mode is available, so
  the app is usable immediately without creating an account.


  Everything is stored in this app's data directory on your Umbrel: no account on
  anyone else's server, no subscription, no telemetry.
releaseNotes: >-
  Packaging fix (same openGym 1.4.5 code): the web front end is now pinned to this
  app's own API container instead of the generic name "api", which on Umbrel's shared
  Docker network could resolve to another app's API. That is what made creating a
  profile and signing in fail with "not found".


  openGym 1.4.5 features: Apple Watch redesign, 26 languages, per-set effort ratings
  (RIR/RPE), timed holds, supersets, estimated 1RM and staged database upgrades.

developer: Duarte Santos
website: https://opengym.duarte-santos.ch
dependencies: []
repo: https://github.com/DuarteSantos8/openGym
support: https://github.com/DuarteSantos8/openGym/issues

port: 8074
path: ""

defaultUsername: ""
defaultPassword: ""
